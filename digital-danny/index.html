<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f6a">
  <meta name="description" content="A multi-path kindness story where every choice creates a real consequence and a different ending.">
  <title>Danny Chooses Kindness — A Choice Story for Bella</title>
  <!--
    📌 Purpose: Give Bella a polished, one-tap story where helpful and unhelpful choices both move the plot forward.
    ❓ Business Question: Can a child see the natural result of every choice without being sent backward? 
    👉 Yes. Every answer opens a consequence scene, and the graph leads to one of seven complete endings.
    🧠 Logic Summary: A data-driven story graph records choices, adjusts three easy-to-read relationship signals,
       renders the next consequence, and builds a personal choice trail at the ending.
  -->
  <style>
    :root {
      --ink: #153755;
      --muted: #58738b;
      --paper: #fffdf7;
      --blue: #147fbd;
      --blue-dark: #0b5f91;
      --gold: #f3b72f;
      --green: #2b9b6f;
      --coral: #e75c4c;
      --purple: #8056b3;
      --line: #d8e6ef;
      --shadow: 0 18px 55px rgba(23, 55, 85, .18);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next", "Nunito", ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 232, 120, .42), transparent 30rem),
        radial-gradient(circle at 88% 16%, rgba(123, 210, 255, .36), transparent 28rem),
        linear-gradient(145deg, #eaf8ff 0%, #fff7dc 54%, #f4edff 100%);
      background-attachment: fixed;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 4px solid #ffd55a;
      outline-offset: 3px;
    }

    .shell {
      width: min(100%, 850px);
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 2px 10px;
      min-height: 46px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, #219bd1, #6950b5);
      box-shadow: 0 5px 0 rgba(38, 67, 122, .18);
      font-size: 21px;
    }

    .brand-copy { min-width: 0; }

    .brand-copy strong,
    .brand-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy strong { font-size: 16px; }
    .brand-copy span { color: var(--muted); font-size: 12px; font-weight: 750; }

    .read-button {
      min-height: 42px;
      padding: 9px 13px;
      border: 2px solid rgba(20, 127, 189, .2);
      border-radius: 14px;
      color: var(--blue-dark);
      background: rgba(255, 255, 255, .82);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(23, 55, 85, .08);
    }

    .read-button[hidden] { display: none; }

    .status-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 2px 10px;
      transition: opacity .2s ease, transform .2s ease;
    }

    .status-panel[hidden] { display: none; }

    .meter {
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid rgba(21, 55, 85, .09);
      border-radius: 15px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 4px 16px rgba(21, 55, 85, .06);
    }

    .meter-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 5px;
      color: #3f607b;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .pips { display: flex; gap: 4px; }

    .pip {
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: #dce8ee;
    }

    .meter[data-meter="voice"] .pip.on { background: var(--blue); }
    .meter[data-meter="care"] .pip.on { background: var(--coral); }
    .meter[data-meter="trust"] .pip.on { background: var(--green); }

    .story-card {
      overflow: hidden;
      border: 1px solid rgba(21, 55, 85, .12);
      border-radius: 30px;
      background: rgba(255, 253, 247, .96);
      box-shadow: var(--shadow);
      transform-origin: 50% 20%;
    }

    .story-card.is-changing { animation: card-in .28s ease-out; }

    @keyframes card-in {
      from { opacity: .3; transform: translateY(7px) scale(.99); }
      to { opacity: 1; transform: none; }
    }

    .image-stage {
      position: relative;
      overflow: hidden;
      min-height: 240px;
      background:
        linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%) 0 0 / 240% 100%,
        #dceef5;
    }

    .image-stage.loading { animation: shimmer 1.3s linear infinite; }

    @keyframes shimmer { to { background-position: -240% 0; } }

    .scene-image {
      display: block;
      width: 100%;
      max-height: 58vh;
      object-fit: contain;
      background: #dceef5;
    }

    .choice-ribbon {
      position: absolute;
      left: 14px;
      bottom: 14px;
      max-width: calc(100% - 28px);
      padding: 9px 13px;
      border: 2px solid rgba(255, 255, 255, .76);
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 56, 84, .88);
      box-shadow: 0 5px 18px rgba(0, 0, 0, .2);
      font-size: 13px;
      font-weight: 900;
      backdrop-filter: blur(7px);
    }

    .choice-ribbon[hidden] { display: none; }

    .story-copy { padding: 22px clamp(18px, 5vw, 38px) 28px; }

    .eyebrow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .eyebrow {
      margin: 0;
      color: var(--purple);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .scene-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    h1 {
      margin: 0 0 10px;
      color: #113754;
      font-size: clamp(27px, 6vw, 43px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .story-text {
      display: grid;
      gap: 8px;
      color: #294e69;
      font-size: clamp(17px, 3.5vw, 21px);
      font-weight: 620;
      line-height: 1.48;
    }

    .story-text p { margin: 0; }

    .prompt {
      margin: 18px 0 10px;
      color: #123f63;
      font-size: clamp(19px, 4vw, 24px);
      font-weight: 950;
    }

    .choices { display: grid; gap: 11px; }

    .choice,
    .continue-button,
    .start-button,
    .restart-button {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 19px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .choice {
      display: grid;
      grid-template-columns: 46px 1fr 30px;
      align-items: center;
      gap: 10px;
      padding: 11px 14px 11px 10px;
      text-align: left;
      color: #173e5d;
      background: #fff;
      border: 2px solid #d9e8f1;
      box-shadow: 0 5px 0 #c8dbe6;
      transition: transform .08s ease, box-shadow .08s ease, border-color .15s ease;
    }

    .choice:hover { border-color: #84c2e1; }

    .choice:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #c8dbe6;
    }

    .choice-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #edf7fc;
      font-size: 25px;
    }

    .choice-copy { min-width: 0; }
    .choice-title { display: block; font-size: clamp(17px, 3.5vw, 20px); font-weight: 950; line-height: 1.15; }
    .choice-hint { display: block; margin-top: 3px; color: #60798b; font-size: 13px; font-weight: 700; line-height: 1.25; }
    .choice-arrow { color: var(--blue); font-size: 26px; font-weight: 950; text-align: right; }

    .continue-button,
    .start-button,
    .restart-button {
      padding: 15px 18px;
      color: #fff;
      background: linear-gradient(145deg, #168ac8, #116fa8);
      box-shadow: 0 7px 0 #095984;
      font-size: 19px;
      font-weight: 950;
      transition: transform .08s ease, box-shadow .08s ease;
    }

    .continue-button:active,
    .start-button:active,
    .restart-button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #095984;
    }

    .cover-card { text-align: center; }

    .cover-card .scene-image {
      width: min(100%, 610px);
      max-height: 68vh;
      margin: 0 auto;
      object-fit: contain;
    }

    .cover-card .story-copy { padding-top: 18px; }

    .cover-kicker {
      margin: 0 0 6px;
      color: var(--purple);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .cover-card h1 { font-size: clamp(30px, 7vw, 48px); }

    .cover-note {
      margin: 0 auto 18px;
      max-width: 600px;
      color: #45647c;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
    }

    .ending-box {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .ending-lesson,
    .path-panel {
      padding: 15px;
      border-radius: 18px;
    }

    .ending-lesson {
      color: #234e42;
      background: #e8f7ef;
      border: 2px solid #bee5cf;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
    }

    .ending-lesson strong { display: block; margin-bottom: 4px; color: #166a4d; }

    .path-panel {
      background: #f4f7fa;
      border: 2px solid #dee8ef;
    }

    .path-panel h2 {
      margin: 0 0 10px;
      color: #214963;
      font-size: 16px;
    }

    .path-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .path-list li {
      padding: 7px 10px;
      border-radius: 999px;
      color: #31536b;
      background: #fff;
      border: 1px solid #d6e2e9;
      font-size: 12px;
      font-weight: 850;
    }

    .ending-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(145deg, #7551aa, #4e83bd);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .footer-note {
      margin: 14px 5px 0;
      color: #5b7284;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .fatal-message {
      margin: 20px;
      padding: 20px;
      border-radius: 18px;
      color: #6d2621;
      background: #fff0ed;
      border: 2px solid #f4c2b9;
      font-size: 17px;
      font-weight: 800;
    }

    @media (min-width: 720px) {
      .choices.two-up { grid-template-columns: repeat(2, 1fr); }
      .choices.two-up .choice:last-child:nth-child(odd) { grid-column: 1 / -1; }
    }

    @media (max-width: 520px) {
      .shell { padding-inline: 8px; }
      .topbar { margin-inline: 4px; }
      .brand-copy span { display: none; }
      .read-button { padding: 8px 10px; font-size: 13px; }
      .status-panel { gap: 5px; }
      .meter { padding: 7px 7px; }
      .meter-label { font-size: 9px; }
      .story-card { border-radius: 23px; }
      .image-stage { min-height: 195px; }
      .scene-image { max-height: 48vh; }
      .story-copy { padding: 18px 15px 23px; }
      .choice { grid-template-columns: 42px 1fr 24px; padding-right: 10px; }
      .choice-icon { width: 40px; height: 40px; }
      .choice-hint { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Danny Chooses Kindness">
        <div class="brand-mark" aria-hidden="true">★</div>
        <div class="brand-copy">
          <strong>Danny Chooses Kindness</strong>
          <span>A choice story for Bella</span>
        </div>
      </div>
      <button class="read-button" id="readButton" type="button">🔊 Read aloud</button>
    </header>

    <section class="status-panel" id="statusPanel" aria-label="Danny's relationship signals" hidden>
      <div class="meter" data-meter="voice" id="voiceMeter"></div>
      <div class="meter" data-meter="care" id="careMeter"></div>
      <div class="meter" data-meter="trust" id="trustMeter"></div>
    </section>

    <article class="story-card" id="storyCard" aria-live="polite">
      <div class="image-stage" id="imageStage">
        <img class="scene-image" id="sceneImage" src="v2-assets/cover.webp" alt="Danny and his dog run toward a colorful kindness adventure.">
        <div class="choice-ribbon" id="choiceRibbon" hidden></div>
      </div>
      <section class="story-copy" id="storyCopy"></section>
    </article>

    <p class="footer-note" id="footerNote">Every choice moves the story forward. There is no wrong page.</p>
  </main>

  <script>
    "use strict";

    /*
      📌 Purpose: Run a branching social story without redirect loops or backward-facing correction screens.
      ❓ Business Question: How do choices remain meaningful across several branches and endings?
      👉 Each choice stores its wording, changes visible relationship signals, and routes to a unique consequence node.
      🧠 Logic Summary: storyNodes is the complete graph; state holds the current node, choice trail, and signal values;
         choose() changes state exactly once; render() rebuilds the accessible page from that state.
    */

    const ASSET = "v2-assets/";

    const storyNodes = {
      cover: {
        kind: "cover",
        image: "cover.webp",
        alt: "Danny and his black-and-white dog run toward a colorful kindness adventure.",
        title: "Danny Chooses Kindness",
        text: ["A story where every choice changes what happens next — made especially for Bella."],
        next: "intro"
      },

      intro: {
        kind: "scene",
        image: "01-intro.webp",
        alt: "Danny and Bella happily color a rainbow poster while their dog watches.",
        eyebrow: "The art-room challenge",
        title: "One poster. Two artists.",
        text: [
          "Danny came to Bella's house for art time. Bella was coloring a rainbow, and Danny wanted to help.",
          "Their dog, Scout, curled beside the table and watched every marker move."
        ],
        next: "sharedMission"
      },

      sharedMission: {
        kind: "scene",
        image: "01-intro.webp",
        alt: "Danny and Bella work side by side on one large rainbow poster.",
        eyebrow: "A shared mission",
        title: "The picture belongs to both of them.",
        text: [
          "Bella drew the rainbow while Danny added clouds and tiny stars. They planned to hang the finished poster in Bella's Happy Place.",
          "Because it was one shared picture, both artists would need space, supplies, and a voice."
        ],
        next: "supplyPuzzle"
      },

      supplyPuzzle: {
        kind: "scene",
        image: "02-pause.webp",
        alt: "Danny notices the marker cups and sees that there is only one bright red marker.",
        eyebrow: "The supply puzzle",
        title: "There are many colors — but only one red.",
        text: [
          "The table had two blue markers and three greens. There was only one bright red marker.",
          "Red was Danny's favorite color, and Bella was already using it for the sun."
        ],
        next: "markerWish"
      },

      markerWish: {
        kind: "scene",
        image: "02-pause.webp",
        alt: "Danny looks at the red marker Bella is using and pauses to think.",
        eyebrow: "A strong feeling",
        title: "Danny wants the red marker now.",
        text: [
          "Danny imagined bright red rays around the sun. He worried that Bella might say no if he asked.",
          "The wanting feeling grew bigger while the red marker moved across her paper."
        ],
        next: "bodySignal"
      },

      bodySignal: {
        kind: "scene",
        image: "02-pause.webp",
        alt: "Danny holds his hands together and pauses before reaching for the red marker.",
        eyebrow: "A body clue",
        title: "Fast hands are Danny's signal to pause.",
        text: [
          "Danny felt his fingers curl and his shoulders lift. Those were clues that his body wanted to act before his brain had a plan.",
          "He put his hands together for one breath. What he chooses now will change how Bella feels — and how the picture turns out."
        ],
        next: "markerChoice"
      },

      markerChoice: {
        kind: "choice",
        image: "03-marker-choice.webp",
        alt: "Danny pauses beside Bella and the red marker on their art table.",
        eyebrow: "Choice 1",
        title: "What should Danny do?",
        text: ["Choose what Danny does. Every answer continues to its real result."],
        prompt: "Danny decides to…",
        choices: [
          {
            icon: "✋",
            label: "Grab the marker",
            hint: "Take it from Bella right now.",
            next: "grabConsequence",
            delta: { care: -1, trust: -1 }
          },
          {
            icon: "💬",
            label: "Ask politely",
            hint: "Use clear words and wait for an answer.",
            next: "askResult",
            delta: { voice: 1, care: 1, trust: 1 }
          },
          {
            icon: "⏳",
            label: "Wait without speaking",
            hint: "Keep the feeling inside.",
            next: "waitSilent",
            delta: { voice: -1 }
          }
        ]
      },

      grabConsequence: {
        kind: "choice",
        image: "grab-consequence.webp",
        alt: "Danny grabs the marker, a red line crosses the picture, and Bella looks startled.",
        eyebrow: "The grab has a result",
        title: "The fast grab changes the picture.",
        text: [
          "Danny pulled the marker before Bella let go. His elbow slid, and a red line streaked across Bella's sun.",
          "Bella moved the marker cup closer to her chair. Now she was not sure Danny would listen."
        ],
        prompt: "Danny sees Bella's face. What does he do?",
        choices: [
          {
            icon: "👉",
            label: "Blame Bella",
            hint: "Say, “You were in my way!”",
            next: "trustHurt",
            delta: { care: -1, trust: -1 }
          },
          {
            icon: "🚪",
            label: "Walk away",
            hint: "Leave without explaining.",
            next: "walkAway",
            delta: { voice: -1, care: -1, trust: -1 }
          },
          {
            icon: "🌱",
            label: "Own the mistake",
            hint: "Tell the truth and apologize.",
            next: "repairChoice",
            delta: { voice: 1, care: 1 }
          }
        ]
      },

      askResult: {
        kind: "choice",
        image: "04-ask-politely.webp",
        alt: "Danny asks Bella for the red marker and Bella answers with a friendly smile.",
        eyebrow: "Clear words help",
        title: "Bella gives Danny a clear answer.",
        text: [
          "Danny asked, “Can I use the red marker when you are done?” Bella said, “Yes. I need two more minutes.”",
          "Danny was glad she answered, but two minutes still felt long."
        ],
        prompt: "What does Danny do during the wait?",
        choices: [
          {
            icon: "⚡",
            label: "Take it before she is done",
            hint: "Ignore the plan because waiting is hard.",
            next: "grabConsequence",
            delta: { care: -1, trust: -1 }
          },
          {
            icon: "⏱️",
            label: "Use a two-minute timer",
            hint: "Make the turn easy to understand.",
            next: "fairTurnPlan",
            delta: { voice: 1, care: 1, trust: 1 }
          },
          {
            icon: "🤐",
            label: "Hide his disappointment",
            hint: "Say nothing even though he feels upset.",
            next: "waitSilent",
            delta: { voice: -1 }
          }
        ]
      },

      waitSilent: {
        kind: "choice",
        image: "wait-silent.webp",
        alt: "Danny waits with folded hands and a disappointed face while Bella keeps coloring.",
        eyebrow: "Silence has a result",
        title: "Bella cannot guess Danny's thoughts.",
        text: [
          "Danny waited without speaking. Bella thought he was happy to wait, so she kept coloring slowly.",
          "Danny's shoulders felt tighter. Scout noticed, but Bella did not know what he needed."
        ],
        prompt: "The feeling is getting bigger. What happens next?",
        choices: [
          {
            icon: "🔒",
            label: "Keep every feeling inside",
            hint: "Stay quiet even when Bella checks on him.",
            next: "quietAftermath",
            delta: { voice: -1, trust: -1 }
          },
          {
            icon: "🗣️",
            label: "Say what he needs",
            hint: "Tell Bella, “Waiting is hard. Can I use green?”",
            next: "fairTurnPlan",
            delta: { voice: 1, care: 1, trust: 1 }
          },
          {
            icon: "👀",
            label: "Take it when Bella looks away",
            hint: "Use the marker without permission.",
            next: "trustHurt",
            delta: { care: -1, trust: -2 }
          }
        ]
      },

      quietAftermath: {
        kind: "choice",
        image: "wait-silent.webp",
        alt: "Bella keeps working while Danny sits quietly and feels left out.",
        eyebrow: "The quiet grows",
        title: "Art time keeps moving without Danny.",
        text: [
          "Bella finished the red sun and began the clouds. Danny had waited so quietly that she thought he wanted a break.",
          "Bella asked, “Are you okay?” This is Danny's last chance to let her understand."
        ],
        prompt: "How does Danny answer?",
        choices: [
          {
            icon: "…",
            label: "Shrug and say nothing",
            hint: "Bella still cannot know what he needs.",
            next: "endingQuiet",
            delta: { voice: -1, trust: -1 }
          },
          {
            icon: "💡",
            label: "Answer honestly",
            hint: "Say, “I want to help, but waiting is hard.”",
            next: "fairTurnPlan",
            delta: { voice: 2, care: 1, trust: 1 }
          }
        ]
      },

      trustHurt: {
        kind: "choice",
        image: "trust-hurt.webp",
        alt: "Bella moves the art supplies closer while Danny realizes that trust has been hurt.",
        eyebrow: "Trust changes",
        title: "Bella protects the supplies.",
        text: [
          "Bella moved the markers beside her chair. “I need some space,” she said.",
          "Danny could see the result: taking and blaming made Bella feel less safe sharing with him."
        ],
        prompt: "What does Danny do with this result?",
        choices: [
          {
            icon: "🫳",
            label: "Take another marker anyway",
            hint: "Ignore Bella's request for space.",
            next: "endingTrust",
            delta: { care: -1, trust: -2 }

    const initialState = () => ({
      current: "cover",
      history: [],
      lastChoice: "",
      meters: { voice: 2, care: 2, trust: 2 },
      scenesSeen: 0
    });

    let state = initialState();

    const elements = {
      card: document.getElementById("storyCard"),
      copy: document.getElementById("storyCopy"),
      image: document.getElementById("sceneImage"),
      stage: document.getElementById("imageStage"),
      ribbon: document.getElementById("choiceRibbon"),
      status: document.getElementById("statusPanel"),
      read: document.getElementById("readButton"),
      footer: document.getElementById("footerNote"),
      meters: {
        voice: document.getElementById("voiceMeter"),
        care: document.getElementById("careMeter"),
        trust: document.getElementById("trustMeter")
      }
    };

    const meterMeta = {
      voice: { icon: "💬", label: "Clear voice" },
      care: { icon: "💗", label: "Care" },
      trust: { icon: "🤝", label: "Trust" }
    };

    function clamp(value) {
      return Math.max(0, Math.min(4, value));
    }

    function applyDelta(delta = {}) {
      Object.entries(delta).forEach(([key, amount]) => {
        if (Object.hasOwn(state.meters, key)) {
          state.meters[key] = clamp(state.meters[key] + amount);
        }
      });
    }

    function updateMeters() {
      Object.entries(elements.meters).forEach(([key, meter]) => {
        const value = state.meters[key];
        const meta = meterMeta[key];
        const pips = Array.from({ length: 4 }, (_, index) =>
          `<span class="pip${index < value ? " on" : ""}"></span>`
        ).join("");

        meter.innerHTML = `
          <div class="meter-label"><span>${meta.icon} ${meta.label}</span><span>${value}/4</span></div>
          <div class="pips" aria-hidden="true">${pips}</div>
        `;
        meter.setAttribute("aria-label", `${meta.label}: ${value} out of 4`);
      });
    }

    function textParagraphs(lines) {
      return lines.map(line => {
        const paragraph = document.createElement("p");
        paragraph.textContent = line;
        return paragraph;
      });
    }

    function renderCover(node) {
      elements.card.classList.add("cover-card");
      elements.copy.innerHTML = "";

      const kicker = document.createElement("p");
      kicker.className = "cover-kicker";
      kicker.textContent = "Seven endings • every choice continues";

      const title = document.createElement("h1");
      title.textContent = node.title;

      const note = document.createElement("p");
      note.className = "cover-note";
      note.textContent = node.text[0];

      const start = document.createElement("button");
      start.type = "button";
      start.className = "start-button";
      start.textContent = "Start Danny's story  →";
      start.addEventListener("click", () => advance(node.next));

      elements.copy.append(kicker, title, note, start);
      elements.footer.textContent = "Helpful and unhelpful choices both lead somewhere real.";
    }

    function renderStandard(node) {
      elements.card.classList.remove("cover-card");
      elements.copy.innerHTML = "";

      const row = document.createElement("div");
      row.className = "eyebrow-row";

      const eyebrow = document.createElement("p");
      eyebrow.className = "eyebrow";
      eyebrow.textContent = node.eyebrow || "Danny's path";

      const count = document.createElement("span");
      count.className = "scene-count";
      count.textContent = `Scene ${state.scenesSeen}`;
      row.append(eyebrow, count);

      const title = document.createElement("h1");
      title.textContent = node.title;

      const body = document.createElement("div");
      body.className = "story-text";
      body.append(...textParagraphs(node.text));

      elements.copy.append(row, title, body);

      if (node.kind === "choice") {
        const prompt = document.createElement("p");
        prompt.className = "prompt";
        prompt.textContent = node.prompt;

        const choices = document.createElement("div");
        choices.className = `choices${node.choices.length <= 3 ? " two-up" : ""}`;

        node.choices.forEach((choice, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice";
          button.setAttribute("aria-label", `${choice.label}. ${choice.hint}`);
          button.innerHTML = `
            <span class="choice-icon" aria-hidden="true">${choice.icon}</span>
            <span class="choice-copy">
              <span class="choice-title">${choice.label}</span>
              <span class="choice-hint">${choice.hint}</span>
            </span>
            <span class="choice-arrow" aria-hidden="true">›</span>
          `;
          button.addEventListener("click", () => choose(choice, index));
          choices.append(button);
        });

        elements.copy.append(prompt, choices);
        elements.footer.textContent = "Tap one choice. Its consequence will become the next page.";
      } else {
        const next = document.createElement("button");
        next.type = "button";
        next.className = "continue-button";
        next.textContent = "Continue the story  →";
        next.addEventListener("click", () => advance(node.next));
        elements.copy.append(document.createElement("br"), next);
        elements.footer.textContent = "Danny's earlier choices are still shaping this path.";
      }
    }

    function renderEnding(node) {
      elements.card.classList.remove("cover-card");
      elements.copy.innerHTML = "";

      const endingName = document.createElement("div");
      endingName.className = "ending-name";
      endingName.textContent = `★ ${node.endingName}`;

      const title = document.createElement("h1");
      title.textContent = node.title;

      const body = document.createElement("div");
      body.className = "story-text";
      body.append(...textParagraphs(node.text));

      const endingBox = document.createElement("div");
      endingBox.className = "ending-box";

      const lesson = document.createElement("div");
      lesson.className = "ending-lesson";
      lesson.innerHTML = `<strong>What Danny learned</strong>${node.lesson}`;

      const pathPanel = document.createElement("div");
      pathPanel.className = "path-panel";
      const pathTitle = document.createElement("h2");
      pathTitle.textContent = "The choices that made this ending";
      const pathList = document.createElement("ol");
      pathList.className = "path-list";

      state.history.forEach(step => {
        const item = document.createElement("li");
        item.textContent = `${step.icon} ${step.label}`;
        pathList.append(item);
      });

      pathPanel.append(pathTitle, pathList);

      const restart = document.createElement("button");
      restart.type = "button";
      restart.className = "restart-button";
      restart.textContent = "Read from the beginning  ↺";
      restart.addEventListener("click", resetStory);

      endingBox.append(lesson, pathPanel, restart);
      elements.copy.append(endingName, title, body, endingBox);
      elements.footer.textContent = "An ending is a result, not a score. Each path teaches something different.";
    }

    function render() {
      const node = storyNodes[state.current];

      if (!node) {
        elements.copy.innerHTML = '<div class="fatal-message">This story page could not be found. Please open the story from the beginning.</div>';
        return;
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        elements.read.hidden = false;
      } else {
        elements.read.hidden = true;
      }

      elements.status.hidden = node.kind === "cover";
      elements.ribbon.hidden = !state.lastChoice || node.kind === "cover";
      elements.ribbon.textContent = state.lastChoice ? `Danny chose: ${state.lastChoice}` : "";
      updateMeters();

      elements.stage.classList.add("loading");
      elements.image.src = ASSET + node.image;
      elements.image.alt = node.alt;
      elements.image.onload = () => elements.stage.classList.remove("loading");
      elements.image.onerror = () => {
        elements.stage.classList.remove("loading");
        elements.image.alt = "The illustration could not load, but the story can still continue.";
      };

      if (node.kind === "cover") renderCover(node);
      else if (node.kind === "ending") renderEnding(node);
      else renderStandard(node);

      elements.card.classList.remove("is-changing");
      void elements.card.offsetWidth;
      elements.card.classList.add("is-changing");

      preloadNextImages(node);
      document.title = `${node.title} — Danny Chooses Kindness`;
    }

    function advance(next) {
      if (!storyNodes[next]) return;
      state.current = next;
      state.lastChoice = "";
      state.scenesSeen += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function choose(choice, index) {
      /*
        ❓ Why record the selected text before changing pages?
        👉 The next consequence can name the cause, and the ending can show Bella the complete chain of decisions.
      */
      state.history.push({
        from: state.current,
        option: index,
        icon: choice.icon,
        label: choice.label,
        to: choice.next
      });
      applyDelta(choice.delta);
      state.lastChoice = choice.label;
      state.current = choice.next;
      state.scenesSeen += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetStory() {
      state = initialState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function preloadNextImages(node) {
      const destinations = node.kind === "choice"
        ? node.choices.map(choice => choice.next)
        : node.next ? [node.next] : [];

      destinations.forEach(destination => {
        const nextNode = storyNodes[destination];
        if (!nextNode) return;
        const image = new Image();
        image.src = ASSET + nextNode.image;
      });
    }

    function readCurrentPage() {
      const node = storyNodes[state.current];
      if (!node || !("speechSynthesis" in window)) return;

      const choiceWords = node.kind === "choice"
        ? ` ${node.prompt} ${node.choices.map(choice => choice.label).join(". ")}.`
        : "";
      const endingWords = node.kind === "ending" ? ` What Danny learned: ${node.lesson}` : "";
      const words = `${node.title}. ${node.text.join(" ")}${choiceWords}${endingWords}`;
      const speech = new SpeechSynthesisUtterance(words);
      speech.rate = .88;
      speech.pitch = 1.03;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }

    elements.read.addEventListener("click", readCurrentPage);
    state.scenesSeen = 1;
    render();
  </script>
