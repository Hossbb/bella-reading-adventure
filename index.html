<!DOCTYPE html>
<html lang="en">
<head>
  <!--
  📌 Purpose: Display Bella's approved high-resolution worksheet as an interactive web activity.
  ❓ Business Question: Can Bella tap the exact illustrated answer cards and receive immediate feedback?
  👉 Yes. The artwork is loaded at high quality and semantic HTML buttons sit over the visible controls.
  🧠 Logic Summary:
  1. Load the responsive page styles.
  2. Display a lightweight image fallback immediately.
  3. Load the four high-resolution artwork data parts.
  4. Join those parts in app.js and replace the fallback.
  5. Keep the illustrated A/B/C/D cards and Check Answer button interactive.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bella Reads">

  <title>Bella's Reading Adventure</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/bella-reading-icon.png">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>

<body>
  <main class="app-shell">
    <section
      class="worksheet"
      id="worksheet"
      aria-label="Bella's Reading Adventure worksheet"
    >
      <img
        class="worksheet-art"
        id="worksheetArt"
        src="assets/worksheets/lost-foal.webp"
        alt="Illustrated reading worksheet about Bella the pony helping a lost foal."
        draggable="false"
      >

      <div
        class="feedback-overlay"
        id="feedback"
        role="status"
        aria-live="polite"
      >
        <span class="feedback-star" aria-hidden="true">★</span>
        <span id="feedbackText">Choose the best answer.</span>
      </div>

      <div class="answer-layer" aria-label="Answer choices">
        <button
          class="answer-hotspot answer-a"
          type="button"
          data-answer="A"
          aria-label="A. She wanted to play games with him."
        ></button>

        <button
          class="answer-hotspot answer-b"
          type="button"
          data-answer="B"
          aria-label="B. She wanted to help him feel brave."
        ></button>

        <button
          class="answer-hotspot answer-c"
          type="button"
          data-answer="C"
          aria-label="C. She wanted him to find her hidden toys."
        ></button>

        <button
          class="answer-hotspot answer-d"
          type="button"
          data-answer="D"
          aria-label="D. She wanted to win a big prize."
        ></button>
      </div>

      <button
        class="check-hotspot"
        id="checkButton"
        type="button"
        aria-label="Check answer"
        disabled
      >
        <span class="sr-only">Check Answer</span>
      </button>

      <div class="success-burst" id="successBurst" aria-hidden="true">
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>
    </section>
  </main>

  <script src="assets/embedded/part1.js?v=4"></script>
  <script src="assets/embedded/part2.js?v=4"></script>
  <script src="assets/embedded/part3.js?v=4"></script>
  <script src="assets/embedded/part4.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
